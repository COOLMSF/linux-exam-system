<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Linux 考试系统</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Analytics: only injected when VITE_ANALYTICS_ENDPOINT is configured -->
    <script>
      (function() {
        var endpoint = '%VITE_ANALYTICS_ENDPOINT%';
        var websiteId = '%VITE_ANALYTICS_WEBSITE_ID%';
        // Skip if env vars are not substituted (local deployment)
        if (!endpoint || endpoint === '%VITE_ANALYTICS_ENDPOINT%' || endpoint.trim() === '') return;
        var s = document.createElement('script');
        s.defer = true;
        s.src = endpoint + '/umami';
        s.setAttribute('data-website-id', websiteId);
        document.body.appendChild(s);
      })();
    </script>
  </body>

</html>
